# Render Blueprint: Render → New → Blueprint → pick this repo.
# The database lives on Neon; paste its connection string into DATABASE_URL when Render asks.
services:
  - type: web
    name: cadence-api
    runtime: docker
    plan: free
    region: frankfurt          # closest Render region to Ghana; match your Neon region
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false            # set in the dashboard (Neon pooled connection string)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_MINUTES
        value: "720"
      - key: ALLOWED_ORIGINS
        sync: false            # e.g. https://cadence-web.vercel.app,http://localhost:5173
      - key: SEED_PASSWORD
        sync: false
      - key: SMS_PROVIDER
        value: mock
      - key: SMS_SENDER_ID
        value: Cadence
      - key: ARKESEL_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: mock
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: AI_PROVIDER
        value: mock
      - key: AI_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DEMO_NOTIFY_EMAIL
        sync: false
      - key: DEMO_NOTIFY_SMS
        sync: false
